name: Firebase Preview

on:
  pull_request:
    branches:
      - main
      - JM
      - codex/feature/frontend-ui
  push:
    branches:
      - JM
      - codex/feature/frontend-ui
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

env:
  GCP_PROJECT_ID: influmatics-ca8ef
  GCP_PROJECT_NUMBER: "313505266042"
  GCP_REGION: asia-northeast3
  FIREBASE_PROJECT_ID: influmatics-ca8ef
  STAGING_API_SERVICE: influmatics-api-staging
  STAGING_RUNS_PREFIX: staging-runs
  RUNS_BUCKET: influmatics-ca8ef-runs
  FIREBASE_PREVIEW_ORIGIN_REGEX: https://influmatics-ca8ef--[a-z0-9-]+\.(web\.app|firebaseapp\.com)
  WORKLOAD_IDENTITY_PROVIDER: projects/313505266042/locations/global/workloadIdentityPools/github-actions/providers/github-ssy2205-influmatics
  DEPLOY_SERVICE_ACCOUNT: influmatics-github-deploy@influmatics-ca8ef.iam.gserviceaccount.com

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy staging API
        run: |
          gcloud run deploy "$STAGING_API_SERVICE" \
            --source . \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 4Gi \
            --timeout 3600 \
            --concurrency 1 \
            --max-instances 2 \
            --no-cpu-throttling \
            --set-env-vars RUN_RETENTION_HOURS=24,INFLUMATICS_RUNS_BUCKET="$RUNS_BUCKET",INFLUMATICS_RUNS_PREFIX="$STAGING_RUNS_PREFIX",INFLUMATICS_CORS_ORIGIN_REGEX="$FIREBASE_PREVIEW_ORIGIN_REGEX" \
            --quiet

      - name: Read staging API URL
        id: api
        run: |
          url="$(gcloud run services describe "$STAGING_API_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web/frontend ci

      - name: Build frontend for preview
        run: npm --prefix web/frontend run build
        env:
          VITE_API_BASE: ${{ steps.api.outputs.url }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Choose Firebase preview channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            channel_id="pr-${{ github.event.pull_request.number }}"
          else
            safe_ref="${GITHUB_REF_NAME//\//-}"
            channel_id="branch-${safe_ref}"
          fi
          echo "id=$channel_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Firebase preview channel
        id: hosting
        run: |
          firebase hosting:channel:deploy "${{ steps.channel.outputs.id }}" \
            --project "$FIREBASE_PROJECT_ID" \
            --expires 7d \
            --non-interactive
        env:
          VITE_API_BASE: ${{ steps.api.outputs.url }}

      - name: Smoke test preview API
        run: |
          curl -fsS "${{ steps.api.outputs.url }}/health"

      - name: Preview summary
        run: |
          echo "### Influmatics preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.api.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase channel: ${{ steps.channel.outputs.id }}" >> "$GITHUB_STEP_SUMMARY"
