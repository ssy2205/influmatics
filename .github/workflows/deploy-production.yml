name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: influmatics-ca8ef
  GCP_PROJECT_NUMBER: "313505266042"
  GCP_REGION: asia-northeast3
  FIREBASE_PROJECT_ID: influmatics-ca8ef
  PRODUCTION_API_SERVICE: influmatics-api
  PRODUCTION_API_BASE: https://influmatics-api-cxemvmm35q-du.a.run.app
  PRODUCTION_RUNS_PREFIX: runs
  RUNS_BUCKET: influmatics-ca8ef-runs
  FIREBASE_PREVIEW_ORIGIN_REGEX: https://influmatics-ca8ef--[a-z0-9-]+\.(web\.app|firebaseapp\.com)
  WORKLOAD_IDENTITY_PROVIDER: projects/313505266042/locations/global/workloadIdentityPools/github-actions/providers/github-ssy2205-influmatics
  DEPLOY_SERVICE_ACCOUNT: influmatics-github-deploy@influmatics-ca8ef.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy production API
        run: |
          gcloud run deploy "$PRODUCTION_API_SERVICE" \
            --source . \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 4Gi \
            --timeout 3600 \
            --concurrency 1 \
            --max-instances 2 \
            --no-cpu-throttling \
            --set-env-vars RUN_RETENTION_HOURS=24,INFLUMATICS_RUNS_BUCKET="$RUNS_BUCKET",INFLUMATICS_RUNS_PREFIX="$PRODUCTION_RUNS_PREFIX",INFLUMATICS_CORS_ORIGIN_REGEX="$FIREBASE_PREVIEW_ORIGIN_REGEX" \
            --quiet

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web/frontend ci

      - name: Build frontend for production
        run: npm --prefix web/frontend run build
        env:
          VITE_API_BASE: ${{ env.PRODUCTION_API_BASE }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive
        env:
          VITE_API_BASE: ${{ env.PRODUCTION_API_BASE }}

      - name: Smoke test production
        run: |
          curl -fsS "$PRODUCTION_API_BASE/health"
          curl -fsS "https://influmatics-ca8ef.web.app" | grep -q "Influmatics Web"
