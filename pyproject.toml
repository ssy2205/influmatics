[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "influmatics"
version = "0.1.0"
description = "Program for Antigenic Variation Analysis of Seasonal Influenza Virus"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Influmatics contributors" }
]
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
web = [
  "fastapi>=0.115",
  "google-cloud-storage>=2.16",
  "python-multipart>=0.0.9",
  "streamlit>=1.35",
  "uvicorn>=0.30",
]
bio = [
  "biopython>=1.83",
]

[project.scripts]
influmatics = "influmatics.cli:main"

[tool.setuptools.packages.find]
include = ["influmatics*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
