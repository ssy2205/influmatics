            <output id="map-year-output" for="map-year">2022</output>
          </div>

            <input id="map-year" type="range" min="2003" max="2022" step="1" value="2022">
            <div class="timeline-ticks mono" aria-hidden="true">
              <span>2003</span><span>2008</span><span>2013</span><span>2018</span><span>2022</span>

        <aside class="map-inspector" aria-label="선택한 표본">
          <h2 id="map-detail-title">점 사이의 거리 읽기</h2>
          <p id="map-detail-body" aria-live="polite">항원 공간에서는 항체 반응이 비슷한 표본이 가깝습니다. 서열 공간으로 바꿔 같은 점의 이웃이 어떻게 달라지는지 살펴보세요.</p>
          <div class="map-legend" aria-label="가상 표본 그룹">
            <span><i style="--dot: #c4ff47"></i>그룹 A</span>
            <span><i style="--dot: #76dce8"></i>그룹 B</span>
            <span><i style="--dot: #e9d6af"></i>그룹 C</span>
          </div>
          <div class="inspector-note" hidden>
            <p>점을 누르면 가까운 표본들이 선으로 연결됩니다. 키보드로는 방향키로 이동하고 Enter로 선택하세요.</p>
          </div>
          <button class="text-link" id="reset-map" type="button" hidden>
            탐색 초기화 <span class="link-line" aria-hidden="true"></span>
          </button>
